[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openocto-dev"
version = "0.1.1"
description = "Samantha: asistente de voz personal local (terminal, PTT global Ctrl+Shift+Space, OpenCode Go)"
license = {text = "BSL-1.1"}
requires-python = ">=3.10"
authors = [
    {name = "Rocket Dev", email = "hello@rocketdev.io"},
]
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "pynput>=1.7",
    "requests>=2.28",
    "ddgs>=9.16",
    "tqdm>=4.64",
    "openai>=1.0",
    "questionary>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
audio = [
    "pywhispercpp>=1.2.0",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.16",
    "edge-tts>=7.3.0",
    "miniaudio>=1.61",
    "vosk>=0.3.45",
]

[project.scripts]
openocto = "openocto.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["openocto"]
