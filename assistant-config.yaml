# Config del asistente de voz personal (modo terminal).
# Atajo global Ctrl+Shift+Space (audio.ptt_hotkey). Sin UI web, sin wake word; VAD opcional
# (audio.ptt_mode: "vad") para pulsar una vez y cortar al callar.

persona: "samantha"

audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  blocksize: 1280
  mic_gain: null          # fija un multiplicador si tu micro es muy flojo
  normalize: true         # normaliza cada toma antes de Whisper (recomendado)
  # "hold" = mantener la combinación de ptt_hotkey mientras hablas (modo clasico)
  # "vad"  = pulsar una vez y hablar; se corta solo al detectar silencio
  #          (usa RegisterHotKey: sin hook de teclado; "hold" usa pynput, que sí
  #          instala un hook global; si otra app ya usa la combinación, cae a pynput)
  ptt_mode: "vad"
  # Tecla global: combinación de ctrl/alt/shift/win + tecla. Ej.: "ctrl+alt+enter".
  ptt_hotkey: "ctrl+shift+space"
  # Conversacion continua: tras responder, reabre el micro solo. Hablas,
  # responde y vuelve a escuchar; si callas no_speech_timeout segundos, termina.
  # Una segunda pulsacion del atajo tambien termina la conversacion.
  continuous: true
  continuous_tail_guard: 1.0  # espera anti-eco antes de reabrir el micro

vad:
  threshold: 0.5           # 0..1; mas alto = mas estricto con la voz
  silence_duration: 0.9    # segundos de silencio para cerrar la toma
  rms_speech_threshold: 50   # micro lejano: deja pasar voz baja a Silero
  # Si el ruido de fondo dispara el VAD, sube a 80-120 (nunca a 300 con micro lejos).

wakeword:
  # Di "Hola Samantha" para despertar, sin pulsar el atajo. El micro queda
  # abierto (Vosk local, sin nube) y solo se graba cuando detecta la frase.
  enabled: true
  phrase: "hola samantha"
  model: "vosk-model-small-es-0.42"
  no_speech_timeout: 8.0   # si no hablas en N s, cancela la toma
  max_recording_duration: 30.0  # tope duro aunque haya ruido

stt:
  # Medido: base = mismo CER que small (2,5%) a un tercio del tiempo.
  model_size: "base"
  language: "es"
  hotwords: ["Bogota"]    # nombres toponimos que Whisper debe preferir
  n_threads: 8

tts:
  # Motor de voz:
  #   edge  = neuronal de Microsoft (mas natural, requiere internet; el texto
  #           de las respuestas se envia a Microsoft)
  #   piper = local, rapido y sin red (mas robotico)
  engine: "edge"
  engines: {}          # override por idioma, ej. {en: "piper"}
  # Solo para engine: edge. La voz se elige por idioma.
  edge:
    voices:
      es: "es-CO-SalomeNeural"    # femenina, acento colombiano
      en: "en-US-AriaNeural"
    rate: "+25%"       # mas rapido; +10%/+30% si quieres ajustar (medido)
    pitch: "+0Hz"
    volume: "+0%"
    timeout: 10.0       # segundos por frase antes de caer al fallback
    # Edge deja ~0,7 s de silencio por frase; recortarlo acelera la charla.
    trim_silence: true
  # Si edge falla o no hay red, se responde con Piper sin cortar el turno.
  # Vacio ("") deja solo el motor principal.
  fallback_engine: "piper"
  # Tras un fallo de Edge, cuanto tiempo se queda en Piper antes de reintentar.
  fallback_cooldown: 30.0
  # Voces Piper: se usan como respaldo y si pones engine: "piper".
  # Alternativas en samples\voz-*.wav (es_AR-daniela-high, es_ES-sharvard-medium).
  models:
    es: "es_MX-claude-high"
    en: "en_US-amy-medium"
  length_scale: 1.0
  # Volumen local del TTS: 1.0 original, 1.6 ≈ +4 dB, 2.0 si hace falta.
  # Usa limitador suave: sube la voz sin saturar. Tambien sube el volumen
  # general de Windows si el altavoz esta bajo.
  gain: 1.6
  # pausa entre frases. La aplica Edge (tras recortar su cola de ~0,7 s);
  # Piper no la usa.
  sentence_silence: 0.25

ai:
  # Clave del backend activo dentro de `providers` (abajo). Para cambiar de
  # proveedor, edita esta línea y reinicia:  python assistant.py start
  default_backend: "go"

  # Solo se usa con la memoria desactivada (memory.enabled: false). Con memoria
  # activa manda memory.recent_window.
  max_history: 20
  # Espera máxima por respuesta del LLM en un turno de voz (segundos).
  turn_timeout: 30
  # Tope de tokens por respuesta de voz. Si usas un modelo que razona, sube este
  # valor: el razonamiento cuenta dentro del tope.
  # Incluye razonamiento + respuesta. MiniMax M3.1 Flash puede gastar 400
  # tokens pensando y dejar el texto vacío; con 800 hay margen.
  max_tokens: 4000

  providers:
    # Cualquier API compatible con OpenAI entra aquí:
    #   nombre: {api_key, model, base_url, headers?, no_auth?}
    # Ejemplo con un servidor local:
    #   lmstudio:
    #     model: "qwen2.5-7b-instruct"
    #     base_url: "http://127.0.0.1:1234/v1"
    #     no_auth: true
    go:
      api_key: "${OPENCODE_GO_API_KEY}"
      # MODELO ACTIVO: cambia solo esta línea y reinicia. Después valida con
      #   python assistant.py check
      model: "minimax-m3.1-flash"
      # El endpoint openai/v1 sirve para TODOS los modelos de texto de Go
      # (el gateway traduce a la API nativa de cada modelo).
      base_url: "https://opencode.ai/inference/go/openai/v1"
      headers:
        User-Agent: "asistente-octo/2.0"
        # Go responde 400 sin x-opencode-session: es requisito de ruteo.
        # OpenOcto no inyecta id por conversación; valor fijo y estable.
        x-opencode-session: "octo-terminal-01"
      # Esfuerzo de razonamiento: SOLO algunos modelos lo respetan.
      # MiniMax M3.1 Flash: low, medium, high, xhigh, max.
      # "none", "auto" y "adaptive" dan HTTP 400; omitir equivale a max.
      # Para voz, "low" es el más rápido. Con high/max sube max_tokens,
      # porque el razonamiento cuenta dentro del tope.
      reasoning_effort: "high"

      # ═══════════════════════════════════════════════════════════════════
      # MODELOS RECOMENDADOS (plan Go: $10/mes; el "límite" es el uso mensual
      # incluido POR MODELO, no una suscripción aparte).
      # Precio por 1M tokens: entrada/salida. TTFT medido en este equipo.
      # IDs exactos; cualquier cambio se valida con `assistant.py check`.
      # ═══════════════════════════════════════════════════════════════════
      #
      # ── PARA VOZ (respuesta rápida; el caso normal) ──────────────────
      # glm-5.3-flash      $0.15/$0.50   lím. $60  ← actual. TTFT 1,24 s,
      #                                        sin razonamiento visible: el
      #                                        mejor equilibrio español+voz.
      # mimo-v2.6-flash    $0.14/$0.28   lím. $60  el más barato. TTFT 1,40 s.
      # qwen3.8-flash      $0.15/$0.47   lím. $30  rápido, muy buen español.
      # minimax-m3.1-flash $0.15/$0.60   lím. $20
      # minimax-m3         $0.30/$1.20   lím. $60
      # claude-haiku-5-5   $0.10/$0.50   lím. $15  voz natural y rápida;
      #                                        tope de uso más bajo.
      # gpt-6-luna         $0.10/$0.50   lím. $15
      # gpt-5.6-luna       $0.20/$1.20   lím. $15
      # hy3                $0.14/$0.58   lím. $60
      # longcat-2.0        $0.30/$1.20   lím. $60
      #
      # ── CALIDAD / CONVERSACIÓN (más lentos o más caros) ──────────────
      # deepseek-v4.1-flash $0.15/$0.60 off-peak, $0.30/$1.20 peak, lím. $100
      #                    razona antes de responder; con
      #                    reasoning_effort: "none" queda apto para voz.
      #                    TTFT medido 1,78 s sin ese ajuste.
      # glm-5.3            $1.40/$4.40   lím. $15  más capaz que el flash.
      # glm-5.2            $1.40/$4.40   lím. $60  alternativa GLM con más cupo.
      # kimi-k3.1-pro      $2.00/$10.00  lím. $15  tope de calidad; para
      #                                        preguntas complejas, no voz.
      # qwen3.8-max        $2.00/$6.00   lím. $15
      # qwen3.7-plus       $0.40/$1.60   lím. $60  (≤256K tokens)
      # gemini-4-argon     $2.00/$10.00  lím. $30  excelente multilingüe
      #                                        (precio con 50% de descuento).
      # grok-4.7           $2.00/$6.00   lím. $15
      # step-5-preview     $1.00/$2.70   lím. $15
      # deepseek-v4-pro    $0.66/$1.98 off-peak, lím. $15
      # mimo-v2.6-pro      $0.435/$0.87  lím. $15
      #
      # ── GRATIS / PROMOCIÓN (leer condiciones antes) ──────────────────
      # beam-free          $0            ilimitado por tiempo limitado; no
      #                                  existe en varios países (Colombia sí).
      # iceman-contributor-free $0      ilimitado, pero ENTRENA con tus datos:
      #                                  no lo uses con conversaciones privadas.
      # muse-spark-1.3/1.2-contributor  $0.10/$0.20: también entrenan con
      #                                  datos y tienen regiones limitadas.
      #
      # Notas:
      # - Los modelos de código/agentic (kimi-k2.7-code, etc.) no aportan
      #   para un asistente de voz.
      # - Límites y precios pueden cambiar: https://opencode.ai/v2/docs/console/go
      # - Listado completo y vigente:
      #   GET https://opencode.ai/inference/go/v1/models


memory:
  enabled: true
  # Turnos de contexto que se mandan con cada respuesta (cada turno son 2 mensajes).
  recent_window: 80

skills:
  enabled:
    - notes
    - web_search
    - wikipedia
    - open_search
  firecrawl:
    timeout: 15
    max_results: 5
    lang: "es"
    country: "CO"
    fallback: "duckduckgo"
    region: "co-es"

ui:
  # Orbe de estado: ventana pequeña que aparece al activar la conversación.
  orb: true

logging:
  # El ARCHIVO guarda DEBUG siempre (lo usa `assistant.py report`).
  level: "DEBUG"
  # La CONSOLA queda limpia: solo avisos/errores. Para ver DEBUG:
  #   python assistant.py start --debug
  console_level: "WARNING"
  # Relativa a la raiz del proyecto (o de la carpeta portable).
  file: "logs/assistant.log"
